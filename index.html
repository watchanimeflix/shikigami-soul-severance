<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shikigami Soul Severance</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            font-family: 'Arial', sans-serif;
        }

        .background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            z-index: 1;
            overflow: hidden;
        }

        .scene {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2;
            perspective: 1200px;
        }

        .character-wrapper {
            position: relative;
            width: 90%;
            max-width: 600px;
            height: 800px;
            display: flex;
            align-items: center;
            justify-content: center;
            filter: drop-shadow(0 0 40px rgba(138, 43, 226, 0.4));
        }

        /* Upper Floating Aura - Above Character */
        .upper-aura {
            position: absolute;
            width: 150%;
            height: 80%;
            top: -30%;
            left: 50%;
            transform: translateX(-50%);
            border-radius: 50%;
            background: radial-gradient(circle at 50% 30%, rgba(138, 43, 226, 0.5) 0%, rgba(220, 20, 60, 0.3) 35%, transparent 70%);
            filter: blur(35px);
            animation: upper-aura-breathe 4s ease-in-out infinite, upper-aura-float 6s ease-in-out infinite;
            z-index: 5;
            pointer-events: none;
        }

        @keyframes upper-aura-breathe {
            0%, 100% {
                transform: translateX(-50%) scale(1) translateY(0);
                opacity: 0.6;
            }
            50% {
                transform: translateX(-50%) scale(1.2) translateY(-20px);
                opacity: 0.9;
            }
        }

        @keyframes upper-aura-float {
            0%, 100% {
                filter: blur(35px) brightness(1);
            }
            50% {
                filter: blur(25px) brightness(1.2);
            }
        }

        /* Side Aura Wisps */
        .aura-wisp {
            position: absolute;
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(138, 43, 226, 0.4) 0%, transparent 70%);
            filter: blur(30px);
            animation: wisp-float 5s ease-in-out infinite;
        }

        .aura-wisp:nth-child(1) {
            left: -50px;
            top: 100px;
            background: radial-gradient(circle, rgba(138, 43, 226, 0.5) 0%, transparent 70%);
            animation-delay: 0s;
        }

        .aura-wisp:nth-child(2) {
            right: -50px;
            top: 150px;
            background: radial-gradient(circle, rgba(220, 20, 60, 0.4) 0%, transparent 70%);
            animation-delay: 1s;
        }

        .aura-wisp:nth-child(3) {
            left: -30px;
            bottom: 100px;
            background: radial-gradient(circle, rgba(138, 43, 226, 0.3) 0%, transparent 70%);
            animation-delay: 2s;
        }

        @keyframes wisp-float {
            0%, 100% {
                transform: translateX(0) translateY(0) scale(1);
                opacity: 0.5;
            }
            50% {
                transform: translateX(30px) translateY(-20px) scale(1.1);
                opacity: 0.8;
            }
        }

        /* Orbiting Energy Particles */
        .particle-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            left: 0;
            top: 0;
            border-radius: 50%;
        }

        .energy-particle {
            position: absolute;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #8a2be2, #dc143c);
            box-shadow: 0 0 15px rgba(138, 43, 226, 0.9), 0 0 30px rgba(220, 20, 60, 0.7), inset -2px -2px 5px rgba(0, 0, 0, 0.5);
            animation: particle-orbit 8s linear infinite;
            filter: blur(0.5px);
        }

        @keyframes particle-orbit {
            0% {
                transform: rotateZ(0deg) translateY(-200px) scale(1);
                opacity: 1;
            }
            25% {
                opacity: 0.8;
            }
            50% {
                opacity: 1;
            }
            75% {
                opacity: 0.8;
            }
            100% {
                transform: rotateZ(360deg) translateY(-200px) scale(1);
                opacity: 1;
            }
        }

        .energy-particle:nth-child(1) {
            animation-delay: 0s;
        }

        .energy-particle:nth-child(2) {
            animation-delay: -2.67s;
        }

        .energy-particle:nth-child(3) {
            animation-delay: -5.33s;
        }

        .energy-particle:nth-child(4) {
            animation-delay: -1.33s;
        }

        .energy-particle:nth-child(5) {
            animation-delay: -4s;
        }

        .energy-particle:nth-child(6) {
            animation-delay: -6.67s;
        }

        /* Rotating Energy Rings */
        .energy-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            left: 0;
            top: 0;
            border-radius: 50%;
            border: 2px solid transparent;
            background: conic-gradient(from 0deg, rgba(138, 43, 226, 0.6), rgba(220, 20, 60, 0.4), rgba(138, 43, 226, 0.6), transparent) border-box;
            -webkit-mask: radial-gradient(circle, black 30%, transparent 100%);
            mask: radial-gradient(circle, black 30%, transparent 100%);
            animation: ring-spin 5s linear infinite;
        }

        .energy-ring:nth-child(7) {
            width: 130%;
            height: 130%;
            left: -15%;
            top: -15%;
            border-width: 2px;
            animation-delay: 0s;
        }

        .energy-ring:nth-child(8) {
            width: 110%;
            height: 110%;
            left: -5%;
            top: -5%;
            border-width: 1.5px;
            animation-delay: -1.5s;
            animation-direction: reverse;
        }

        .energy-ring:nth-child(9) {
            width: 90%;
            height: 90%;
            left: 5%;
            top: 5%;
            border-width: 1px;
            animation-delay: -2.5s;
        }

        @keyframes ring-spin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        /* Character Container with Breathing Effect */
        .character-container {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: character-breathe 3s ease-in-out infinite;
        }

        @keyframes character-breathe {
            0%, 100% {
                transform: scale(1) translateY(0);
            }
            50% {
                transform: scale(1.03) translateY(-10px);
            }
        }

        .character-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 0 30px rgba(138, 43, 226, 0.5)) drop-shadow(0 20px 40px rgba(0, 0, 0, 0.6));
            animation: character-glow 3s ease-in-out infinite;
        }

        @keyframes character-glow {
            0%, 100% {
                filter: drop-shadow(0 0 30px rgba(138, 43, 226, 0.5)) drop-shadow(0 20px 40px rgba(0, 0, 0, 0.6)) brightness(1);
            }
            50% {
                filter: drop-shadow(0 0 50px rgba(138, 43, 226, 0.7)) drop-shadow(0 20px 40px rgba(0, 0, 0, 0.6)) brightness(1.1);
            }
        }

        /* Eye Glow Effect - Overlay */
        .eye-glow-overlay {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 11;
            background: 
                radial-gradient(circle 40px at 35% 35%, rgba(0, 150, 255, 0.3) 0%, transparent 50%),
                radial-gradient(circle 40px at 65% 35%, rgba(0, 150, 255, 0.3) 0%, transparent 50%);
            animation: eye-glow 2.5s ease-in-out infinite;
            filter: blur(15px);
        }

        @keyframes eye-glow {
            0%, 100% {
                opacity: 0.3;
            }
            50% {
                opacity: 0.8;
            }
        }

        /* Flowing Energy Trails */
        .energy-trail {
            position: absolute;
            width: 3px;
            height: 100px;
            left: 50%;
            top: 0;
            margin-left: -1.5px;
            background: linear-gradient(to bottom, rgba(220, 20, 60, 0.6), transparent);
            filter: blur(2px);
            animation: trail-flow 2s ease-in-out infinite;
            pointer-events: none;
        }

        .energy-trail:nth-child(10) {
            transform: rotate(-60deg) translateY(-100px);
            animation-delay: 0s;
        }

        .energy-trail:nth-child(11) {
            transform: rotate(0deg) translateY(-100px);
            animation-delay: 0.3s;
        }

        .energy-trail:nth-child(12) {
            transform: rotate(60deg) translateY(-100px);
            animation-delay: 0.6s;
        }

        @keyframes trail-flow {
            0% {
                transform: translateY(0);
                opacity: 1;
            }
            100% {
                transform: translateY(-50px);
                opacity: 0;
            }
        }

        /* Core Pulsing Heart */
        .core-heart {
            position: absolute;
            width: 60%;
            height: 60%;
            left: 20%;
            top: 20%;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(138, 43, 226, 0.3) 0%, transparent 70%);
            filter: blur(50px);
            animation: heart-pulse 2s ease-in-out infinite;
            z-index: 8;
        }

        @keyframes heart-pulse {
            0%, 100% {
                transform: scale(0.8);
                opacity: 0.3;
            }
            50% {
                transform: scale(1.2);
                opacity: 0.7;
            }
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(0, 0, 0, 0.2), rgba(0, 0, 0, 0.4));
            z-index: 3;
        }

        .content {
            position: relative;
            z-index: 4;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            color: white;
        }

        .title {
            font-size: 3em;
            font-weight: bold;
            text-shadow: 0 0 20px rgba(138, 43, 226, 0.8), 0 0 40px rgba(220, 20, 60, 0.6);
            margin-bottom: 20px;
            animation: fadeIn 2s ease-in;
            letter-spacing: 2px;
        }

        .subtitle {
            font-size: 1.2em;
            text-shadow: 0 0 10px rgba(138, 43, 226, 0.6);
            margin-bottom: 40px;
            animation: fadeIn 2.5s ease-in;
            opacity: 0.9;
        }

        .loading-bar {
            width: 200px;
            height: 3px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 20px;
            animation: fadeIn 3s ease-in;
        }

        .loading-fill {
            height: 100%;
            background: linear-gradient(90deg, #8a2be2, #dc143c, #8a2be2);
            border-radius: 10px;
            animation: load 2s ease-in-out infinite;
        }

        @keyframes load {
            0%, 100% {
                width: 0%;
            }
            50% {
                width: 100%;
            }
        }

        .redirect-text {
            font-size: 0.9em;
            color: rgba(255, 255, 255, 0.7);
            animation: fadeIn 3.5s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 768px) {
            .title {
                font-size: 2em;
            }

            .subtitle {
                font-size: 1em;
            }

            .character-wrapper {
                max-width: 400px;
                height: 600px;
            }
        }
    </style>
</head>
<body>
    <div class="background"></div>

    <div class="scene">
        <div class="character-wrapper">
            <!-- Upper Floating Aura (Above Character) -->
            <div class="upper-aura"></div>

            <!-- Side Aura Wisps -->
            <div class="aura-wisp"></div>
            <div class="aura-wisp"></div>
            <div class="aura-wisp"></div>

            <!-- Core Pulsing Heart -->
            <div class="core-heart"></div>

            <!-- Energy Rings -->
            <div class="energy-ring"></div>
            <div class="energy-ring"></div>
            <div class="energy-ring"></div>

            <!-- Orbiting Particles -->
            <div class="particle-ring">
                <div class="energy-particle"></div>
                <div class="energy-particle"></div>
                <div class="energy-particle"></div>
                <div class="energy-particle"></div>
                <div class="energy-particle"></div>
                <div class="energy-particle"></div>
            </div>

            <!-- Energy Trails -->
            <div class="energy-trail"></div>
            <div class="energy-trail"></div>
            <div class="energy-trail"></div>

            <!-- Character with Breathing & Glowing -->
            <div class="character-container">
                <img src="IMG_5681.jpeg" alt="Shikigami Character" class="character-image">
            </div>

            <!-- Eye Glow Overlay -->
            <div class="eye-glow-overlay"></div>
        </div>
    </div>

    <div class="overlay"></div>

    <div class="content">
        <h1 class="title">SHIKIGAMI</h1>
        <h2 class="subtitle">Soul Severance</h2>
        
        <div class="loading-bar">
            <div class="loading-fill"></div>
        </div>
        
        <p class="redirect-text">Redirecting...</p>
    </div>

    <script>
        // Redirect after 5 seconds
        setTimeout(() => {
            window.location.href = "https://trimz.tv/shikigami-soul-severance";
        }, 5000);
    </script>
</body>
</html>
