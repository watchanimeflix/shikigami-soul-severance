<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shikigami Soul Severance</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            font-family: 'Arial', sans-serif;
        }

        .background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            z-index: 1;
            overflow: hidden;
        }

        .scene {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2;
            perspective: 1000px;
        }

        .character-wrapper {
            position: relative;
            width: 90%;
            max-width: 600px;
            height: auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 3D Aura Sphere */
        .aura-sphere {
            position: absolute;
            width: 120%;
            height: 120%;
            left: -10%;
            top: -10%;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, rgba(138, 43, 226, 0.4) 0%, rgba(138, 43, 226, 0.2) 25%, rgba(220, 20, 60, 0.2) 50%, transparent 70%);
            filter: blur(30px);
            animation: aura-rotate 8s linear infinite, aura-pulse 4s ease-in-out infinite;
            transform-style: preserve-3d;
        }

        @keyframes aura-rotate {
            0% {
                transform: rotateY(0deg) rotateX(20deg);
            }
            100% {
                transform: rotateY(360deg) rotateX(20deg);
            }
        }

        @keyframes aura-pulse {
            0%, 100% {
                transform: scale(1) rotateY(0deg) rotateX(20deg);
                opacity: 0.6;
            }
            50% {
                transform: scale(1.15) rotateY(180deg) rotateX(20deg);
                opacity: 0.9;
            }
        }

        /* Orbiting Particles */
        .particle-orbit {
            position: absolute;
            width: 100%;
            height: 100%;
            left: 0;
            top: 0;
            border-radius: 50%;
        }

        .particle {
            position: absolute;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: radial-gradient(circle, #8a2be2 0%, #dc143c 100%);
            box-shadow: 0 0 10px rgba(138, 43, 226, 0.8), 0 0 20px rgba(220, 20, 60, 0.6);
            animation: orbit 6s linear infinite;
        }

        @keyframes orbit {
            0% {
                transform: rotateZ(0deg) translateY(-150px) scale(1);
                opacity: 1;
            }
            50% {
                opacity: 0.6;
            }
            100% {
                transform: rotateZ(360deg) translateY(-150px) scale(0.8);
                opacity: 0;
            }
        }

        .particle:nth-child(1) {
            animation-delay: 0s;
            --angle: 0deg;
        }

        .particle:nth-child(2) {
            animation-delay: -2s;
            --angle: 120deg;
        }

        .particle:nth-child(3) {
            animation-delay: -4s;
            --angle: 240deg;
        }

        .particle:nth-child(4) {
            animation-delay: -1s;
            --angle: 60deg;
        }

        .particle:nth-child(5) {
            animation-delay: -3s;
            --angle: 180deg;
        }

        .particle:nth-child(6) {
            animation-delay: -5s;
            --angle: 300deg;
        }

        /* Energy Rings */
        .energy-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            left: 0;
            top: 0;
            border: 2px solid transparent;
            border-radius: 50%;
            background: linear-gradient(45deg, rgba(138, 43, 226, 0.6), rgba(220, 20, 60, 0.4), rgba(138, 43, 226, 0.6)) border-box;
            -webkit-mask: linear-gradient(45deg, transparent 20%, black 50%, transparent 80%);
            mask: linear-gradient(45deg, transparent 20%, black 50%, transparent 80%);
            animation: ring-spin 4s linear infinite;
        }

        .energy-ring:nth-child(1) {
            width: 110%;
            height: 110%;
            left: -5%;
            top: -5%;
            animation-delay: 0s;
            animation-duration: 4s;
        }

        .energy-ring:nth-child(2) {
            width: 95%;
            height: 95%;
            left: 2.5%;
            top: 2.5%;
            animation-delay: -2s;
            animation-duration: 6s;
        }

        .energy-ring:nth-child(3) {
            width: 125%;
            height: 125%;
            left: -12.5%;
            top: -12.5%;
            border-width: 1px;
            animation-delay: -3s;
            animation-duration: 8s;
        }

        @keyframes ring-spin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        /* Flame Wisps */
        .flame-wisp {
            position: absolute;
            width: 40px;
            height: 60px;
            left: 50%;
            top: 50%;
            margin-left: -20px;
            margin-top: -30px;
            background: radial-gradient(ellipse at center, rgba(220, 20, 60, 0.8) 0%, rgba(255, 69, 0, 0.6) 40%, transparent 70%);
            filter: blur(8px);
            border-radius: 50% 50% 50% 0%;
            transform-origin: center;
            animation: wisp-float 3s ease-in-out infinite;
        }

        .flame-wisp:nth-child(4) {
            animation-delay: 0s;
            transform: rotate(0deg);
        }

        .flame-wisp:nth-child(5) {
            animation-delay: 0.5s;
            transform: rotate(120deg);
        }

        .flame-wisp:nth-child(6) {
            animation-delay: 1s;
            transform: rotate(240deg);
        }

        @keyframes wisp-float {
            0%, 100% {
                transform: translateY(0) scale(1);
                opacity: 0.6;
            }
            50% {
                transform: translateY(-30px) scale(1.2);
                opacity: 0.9;
            }
        }

        .character-image {
            position: relative;
            z-index: 10;
            width: 100%;
            height: auto;
            object-fit: contain;
            filter: drop-shadow(0 0 20px rgba(138, 43, 226, 0.5));
            animation: character-float 6s ease-in-out infinite;
        }

        @keyframes character-float {
            0%, 100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-15px);
            }
        }

        /* Core Inner Glow */
        .core-glow {
            position: absolute;
            width: 80%;
            height: 80%;
            left: 10%;
            top: 10%;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(138, 43, 226, 0.2) 0%, transparent 70%);
            filter: blur(40px);
            animation: core-pulse 3s ease-in-out infinite;
        }

        @keyframes core-pulse {
            0%, 100% {
                transform: scale(1);
                opacity: 0.4;
            }
            50% {
                transform: scale(1.1);
                opacity: 0.7;
            }
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(0, 0, 0, 0.2), rgba(0, 0, 0, 0.4));
            z-index: 3;
        }

        .content {
            position: relative;
            z-index: 4;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            color: white;
        }

        .title {
            font-size: 3em;
            font-weight: bold;
            text-shadow: 0 0 20px rgba(138, 43, 226, 0.8), 0 0 40px rgba(220, 20, 60, 0.6);
            margin-bottom: 20px;
            animation: fadeIn 2s ease-in;
            letter-spacing: 2px;
        }

        .subtitle {
            font-size: 1.2em;
            text-shadow: 0 0 10px rgba(138, 43, 226, 0.6);
            margin-bottom: 40px;
            animation: fadeIn 2.5s ease-in;
            opacity: 0.9;
        }

        .loading-bar {
            width: 200px;
            height: 3px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 20px;
            animation: fadeIn 3s ease-in;
        }

        .loading-fill {
            height: 100%;
            background: linear-gradient(90deg, #8a2be2, #dc143c, #8a2be2);
            border-radius: 10px;
            animation: load 2s ease-in-out infinite;
        }

        @keyframes load {
            0%, 100% {
                width: 0%;
            }
            50% {
                width: 100%;
            }
        }

        .redirect-text {
            font-size: 0.9em;
            color: rgba(255, 255, 255, 0.7);
            animation: fadeIn 3.5s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 768px) {
            .title {
                font-size: 2em;
            }

            .subtitle {
                font-size: 1em;
            }

            .character-image {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="background"></div>

    <div class="scene">
        <div class="character-wrapper">
            <!-- 3D Aura Sphere -->
            <div class="aura-sphere"></div>

            <!-- Energy Rings -->
            <div class="energy-ring"></div>
            <div class="energy-ring"></div>
            <div class="energy-ring"></div>

            <!-- Orbiting Particles -->
            <div class="particle-orbit">
                <div class="particle"></div>
                <div class="particle"></div>
                <div class="particle"></div>
                <div class="particle"></div>
                <div class="particle"></div>
                <div class="particle"></div>
            </div>

            <!-- Flame Wisps -->
            <div class="flame-wisp"></div>
            <div class="flame-wisp"></div>
            <div class="flame-wisp"></div>

            <!-- Core Inner Glow -->
            <div class="core-glow"></div>

            <!-- Character Image -->
            <img src="IMG_5681.jpeg" alt="Shikigami Character" class="character-image">
        </div>
    </div>

    <div class="overlay"></div>

    <div class="content">
        <h1 class="title">SHIKIGAMI</h1>
        <h2 class="subtitle">Soul Severance</h2>
        
        <div class="loading-bar">
            <div class="loading-fill"></div>
        </div>
        
        <p class="redirect-text">Redirecting...</p>
    </div>

    <script>
        // Redirect after 5 seconds
        setTimeout(() => {
            window.location.href = "https://trimz.tv/world/shikigami-soul-severance";
        }, 5000);
    </script>
</body>
</html>
