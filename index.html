<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shikigami Soul Severance</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            font-family: 'Arial', sans-serif;
        }

        .background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            z-index: 1;
            overflow: hidden;
        }

        .character-container {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2;
        }

        .character-image {
            width: 90%;
            max-width: 600px;
            height: auto;
            object-fit: contain;
            filter: drop-shadow(0 0 30px rgba(138, 43, 226, 0.6)) drop-shadow(0 0 60px rgba(220, 20, 60, 0.4));
            animation: float 6s ease-in-out infinite, pulse 4s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0px) scale(1);
            }
            50% {
                transform: translateY(-20px) scale(1.02);
            }
        }

        @keyframes pulse {
            0%, 100% {
                filter: drop-shadow(0 0 30px rgba(138, 43, 226, 0.6)) drop-shadow(0 0 60px rgba(220, 20, 60, 0.4));
            }
            50% {
                filter: drop-shadow(0 0 50px rgba(138, 43, 226, 0.8)) drop-shadow(0 0 80px rgba(220, 20, 60, 0.6));
            }
        }

        .glow-effect {
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(138, 43, 226, 0.3) 0%, rgba(220, 20, 60, 0.2) 50%, transparent 70%);
            border-radius: 50%;
            filter: blur(40px);
            animation: glow-pulse 6s ease-in-out infinite;
        }

        .glow-effect:nth-child(1) {
            top: -100px;
            right: -100px;
            animation-delay: 0s;
        }

        .glow-effect:nth-child(2) {
            bottom: -100px;
            left: -100px;
            animation-delay: 2s;
        }

        @keyframes glow-pulse {
            0%, 100% {
                transform: scale(1);
                opacity: 0.5;
            }
            50% {
                transform: scale(1.2);
                opacity: 0.8;
            }
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(0, 0, 0, 0.3), rgba(0, 0, 0, 0.5));
            z-index: 3;
        }

        .content {
            position: relative;
            z-index: 4;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            color: white;
        }

        .title {
            font-size: 3em;
            font-weight: bold;
            text-shadow: 0 0 20px rgba(138, 43, 226, 0.8), 0 0 40px rgba(220, 20, 60, 0.6);
            margin-bottom: 20px;
            animation: fadeIn 2s ease-in;
            letter-spacing: 2px;
        }

        .subtitle {
            font-size: 1.2em;
            text-shadow: 0 0 10px rgba(138, 43, 226, 0.6);
            margin-bottom: 40px;
            animation: fadeIn 2.5s ease-in;
            opacity: 0.9;
        }

        .loading-bar {
            width: 200px;
            height: 3px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 20px;
            animation: fadeIn 3s ease-in;
        }

        .loading-fill {
            height: 100%;
            background: linear-gradient(90deg, #8a2be2, #dc143c, #8a2be2);
            border-radius: 10px;
            animation: load 2s ease-in-out infinite;
        }

        @keyframes load {
            0%, 100% {
                width: 0%;
            }
            50% {
                width: 100%;
            }
        }

        .redirect-text {
            font-size: 0.9em;
            color: rgba(255, 255, 255, 0.7);
            animation: fadeIn 3.5s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 768px) {
            .title {
                font-size: 2em;
            }

            .subtitle {
                font-size: 1em;
            }

            .character-image {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="background">
        <div class="glow-effect"></div>
        <div class="glow-effect"></div>
    </div>

    <div class="character-container">
        <img src="https://images.unsplash.com/photo-1614613535308-eb5fbd8f2c81?w=600&h=600&fit=crop" alt="Shikigami Character" class="character-image">
    </div>

    <div class="overlay"></div>

    <div class="content">
        <h1 class="title">SHIKIGAMI</h1>
        <h2 class="subtitle">Soul Severance</h2>
        
        <div class="loading-bar">
            <div class="loading-fill"></div>
        </div>
        
        <p class="redirect-text">Redirecting...</p>
    </div>

    <script>
        // Redirect after 5 seconds
        setTimeout(() => {
            window.location.href = "https://trimz.tv/world/shikigami-soul-severance";
        }, 5000);
    </script>
</body>
</html>
